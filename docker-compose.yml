version: "3.8"

services:
  postgres_identity:
    image: postgres:15
    container_name: postgres_identity
    restart: always
    environment:
      POSTGRES_DB: identity_service
      POSTGRES_USER: identity_admin
      POSTGRES_PASSWORD: MyStrongPassword456@
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - smarthealth_network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_identity:5432/identity_service
      KC_DB_USERNAME: identity_admin
      KC_DB_PASSWORD: MyStrongPassword456@
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - start
      - --hostname=keycloak.smarthealth.io.vn
      - --hostname-strict=false
      - --http-port=8080
      - --http-enabled=true
      - --proxy=edge
    depends_on:
      - postgres_identity
    ports:
      - "8080:8080"
    networks:
      - smarthealth_network

  identity_service:
    image: ${DOCKER_USERNAME}/smarthealth-identity-service:latest
    container_name: identity_service
    restart: always
    depends_on:
      - postgres_identity
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_identity:5432/identity_service
      SPRING_DATASOURCE_USERNAME: identity_admin
      SPRING_DATASOURCE_PASSWORD: MyStrongPassword456@
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
    networks:
      - smarthealth_network

  clinic_web:
    image: ${DOCKER_USERNAME}/smarthealth-clinic-web:latest
    container_name: clinic_web
    restart: always
    depends_on:
      - postgres_identity
      - keycloak
      - identity_service
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.smarthealth.io.vn/api
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
    networks:
      - smarthealth_network

  api_gateway:
    image: ${DOCKER_USERNAME}/smarthealth-api-gateway:latest
    container_name: api_gateway
    restart: always
    depends_on:
      - identity_service
    ports:
      - "3001:3001"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
    networks:
      - smarthealth_network

  web_app_service:
    image: ${DOCKER_USERNAME}/smarthealth-web-app-service:latest
    container_name: web_app_service
    restart: always
    depends_on:
      - postgres_identity
    ports:
      - "3002:3002"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
    networks:
      - smarthealth_network

volumes:
  pgdata:

networks:
  smarthealth_network:
    driver: bridge
