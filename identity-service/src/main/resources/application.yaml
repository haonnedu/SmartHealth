server:
  port: 8081
  servlet:
    context-path: /identity

spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/identity_service?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: MySecureRootPass123!
    password: MyStrongPassword456@
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update # Options: create, create-drop, update, validate,
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  profiles:
    active: dev # Set the active profile (e.g., dev, prod)

# Logging configuration (optional)
logging:
  level:
    org:
      hibernate: INFO
      springframework: INFO
    com:
      yourpackage: DEBUG