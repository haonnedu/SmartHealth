name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cloud Run & Artifact Registry region
  REGION: asia-southeast1
  # Cloud Build region (dùng global để tránh quota theo region)
  BUILD_REGION: global
  AR_REPO: microservices
  RUNTIME_SA: cloud-run-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  LOGS_BUCKET: gs://smarthealth-build-logs

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Detect changes để build Keycloak có điều kiện
      - name: Check file changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            keycloak:
              - 'keycloak/**'

      # ---- Auth GCP bằng WIF (không dùng key JSON) ----
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      # ---- Ensure logs bucket & grant writer cho Cloud Build SA ----
      - name: Ensure logs bucket & grant writer
        shell: bash
        run: |
          set -euo pipefail
          # Tạo bucket nếu chưa có (nên cùng region với hệ thống)
          gcloud storage buckets describe "${LOGS_BUCKET}" || \
          gcloud storage buckets create "${LOGS_BUCKET}" --location="${REGION}" --uniform-bucket-level-access

          # Lấy project number để xác định SA của Cloud Build
          PROJECT_NUMBER="$(gcloud projects describe "${{ secrets.GCP_PROJECT_ID }}" --format='value(projectNumber)')"

          # Cho Cloud Build SA quyền ghi object vào bucket logs
          gcloud storage buckets add-iam-policy-binding "${LOGS_BUCKET}" \
            --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
            --role="roles/storage.objectCreator"

      # ---- Ensure Artifact Registry repo ----
      - name: Ensure Artifact Registry repo
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "${AR_REPO}" --location="${REGION}" || \
          gcloud artifacts repositories create "${AR_REPO}" --repository-format=docker --location="${REGION}"

      # ---- Helper: build & wait (polling, không stream logs) ----
      - name: Define build helper
        shell: bash
        run: |
          set -euo pipefail
          build_and_wait () {
            local SRC_DIR="$1"
            local IMAGE="$2"
            echo "Submitting build for ${SRC_DIR} -> ${IMAGE}"

            BUILD_ID="$(gcloud builds submit "${SRC_DIR}" \
              --region="${BUILD_REGION}" \
              --tag "${IMAGE}" \
              --gcs-log-dir="${LOGS_BUCKET}/build-logs" \
              --format='value(id)' \
              --async)"

            echo "Build ID: ${BUILD_ID}"

            # Poll trạng thái đến khi hoàn tất
            while true; do
              STATUS="$(gcloud builds describe "${BUILD_ID}" \
                        --region="${BUILD_REGION}" \
                        --format='value(status)')"
              echo "Status: ${STATUS}"
              case "${STATUS}" in
                SUCCESS) break ;;
                FAILURE|CANCELLED|TIMEOUT)
                  echo "Build failed with status: ${STATUS}"; exit 1 ;;
                *) sleep 5 ;;
              esac
            done
            echo "Build finished: ${STATUS}"
          }

          # Lưu hàm cho các step sau
          declare -f build_and_wait > /tmp/build_helper.sh

      # ---------- Build images ----------
      - name: Build & Push identity-service
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/build_helper.sh
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}/identity:${{ github.sha }}"
          build_and_wait "./identity-service" "${IMAGE}"
          echo "IMAGE_IDENTITY=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build & Push web-app-service
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/build_helper.sh
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}/web-app-service:${{ github.sha }}"
          build_and_wait "./web-app-service" "${IMAGE}"
          echo "IMAGE_WEBAPP=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build & Push api-gateway
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/build_helper.sh
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}/api-gateway:${{ github.sha }}"
          build_and_wait "./api-gateway" "${IMAGE}"
          echo "IMAGE_GATEWAY=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build & Push clinic-web
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/build_helper.sh

          # debug để chắc chắn path đúng
          pwd
          ls -la
          ls -la ./web-app/clinic-website

          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}/clinic-web:${{ github.sha }}"
          build_and_wait "./web-app/clinic-website" "${IMAGE}"
          echo "IMAGE_CLINIC=${IMAGE}" >> "$GITHUB_ENV"

      # ---- Build Keycloak chỉ khi có thay đổi trong keycloak/** ----
      - name: Build & Push keycloak
        if: steps.changes.outputs.keycloak == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/build_helper.sh
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}/keycloak:${{ github.sha }}"
          build_and_wait "./keycloak" "${IMAGE}"
          echo "IMAGE_KC=${IMAGE}" >> "$GITHUB_ENV"

      # ---------- Deploy theo thứ tự phụ thuộc ----------
      - name: Deploy identity-service
        shell: bash
        run: |
          gcloud run deploy identity-service \
            --image "$IMAGE_IDENTITY" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --cpu 1 --memory 512Mi --min-instances 0 --max-instances 3 \
            --set-env-vars SPRING_DATASOURCE_USERNAME=postgres.munjhtusfnmmibzgjple \
            --set-secrets SPRING_DATASOURCE_URL=JDBC_IDENTITY:latest,SPRING_DATASOURCE_PASSWORD=DB_PASSWORD:latest

          ID_URL=$(gcloud run services describe identity-service --region "$REGION" --format="value(status.url)")
          echo "IDENTITY_URL=$ID_URL" >> "$GITHUB_ENV"

      - name: Deploy web-app-service (internal)
        shell: bash
        run: |
          gcloud run deploy web-app-service \
            --image "$IMAGE_WEBAPP" \
            --region "$REGION" \
            --no-allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --cpu 1 --memory 256Mi --min-instances 0 --max-instances 3 \
            --set-env-vars DB_USERNAME=postgres.munjhtusfnmmibzgjple \
            --set-secrets JDBC_URL=JDBC_WEBAPP:latest,DB_PASSWORD=DB_PASSWORD:latest

      - name: Deploy api-gateway
        shell: bash
        run: |
          gcloud run deploy api-gateway \
            --image "$IMAGE_GATEWAY" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --cpu 1 --memory 256Mi --min-instances 0 --max-instances 3 \
            --set-env-vars IDENTITY_URL="$IDENTITY_URL"

      - name: Deploy clinic-web
        shell: bash
        run: |
          gcloud run deploy clinic-web \
            --image "$IMAGE_CLINIC" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --cpu 1 --memory 256Mi --min-instances 0 --max-instances 3 \
            --set-env-vars NODE_ENV=production,NEXT_PUBLIC_API_URL="https://api.smarthealth.io.vn/api" \
            --set-secrets OPENAI_API_KEY=OPENAI_API_KEY:latest

      - name: Deploy keycloak
        if: steps.changes.outputs.keycloak == 'true'
        shell: bash
        run: |
          gcloud run deploy keycloak \
            --image "$IMAGE_KC" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --cpu 1 --memory 1Gi --min-instances 0 --max-instances 2 \
            --set-env-vars KC_DB=postgres,KC_DB_USERNAME=postgres \
            --set-secrets KC_DB_URL=JDBC_IDENTITY:latest,KC_DB_PASSWORD=DB_PASSWORD:latest,KEYCLOAK_ADMIN=KEYCLOAK_ADMIN:latest,KEYCLOAK_ADMIN_PASSWORD=KEYCLOAK_ADMIN_PASSWORD:latest \
            --args start,--proxy=edge,--hostname=keycloak.smarthealth.io.vn,--hostname-strict=false,--http-enabled=true,--http-port=\$PORT
