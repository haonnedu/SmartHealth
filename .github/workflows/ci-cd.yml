name: CI/CD Pipeline for SmartHealth

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------- BACKEND (identity-service) --------------------

      # Bước 2: Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Bước 3: Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Bước 4: Build identity-service
      - name: Build identity-service
        working-directory: ./identity-service
        run: mvn clean package -DskipTests

      # -------------------- FRONTEND (clinic-website) --------------------

      # Bước 5: Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Bước 6: Cache Node.js modules for clinic-web
      - name: Cache Node.js modules for clinic-web
        uses: actions/cache@v4
        with:
          path: ./web-app/clinic-website/node_modules
          key: ${{ runner.os }}-node-clinic-web-${{ hashFiles('./web-app/clinic-website/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-clinic-web-

      # Bước 7: Build clinic-web
      - name: Build clinic-web
        working-directory: ./web-app/clinic-website
        run: |
          echo "NEXT_PUBLIC_API_URL=http://identity.smarthealth.io.vn/identity" > .env.production
          npm ci
          npm run build

      # -------------------- API Gateway --------------------

      # Bước 8: Cache Node.js modules for api-gateway
      - name: Cache Node.js modules for api-gateway
        uses: actions/cache@v4
        with:
          path: ./api-gateway/node_modules
          key: ${{ runner.os }}-node-api-gateway-${{ hashFiles('./api-gateway/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-api-gateway-

      # Bước 9: Build api-gateway
      - name: Build api-gateway
        working-directory: ./api-gateway
        run: |
          npm ci
          npm run build --if-present

      # -------------------- Docker Push --------------------

      # Bước 10: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 11: Build & Push identity-service Docker image
      - name: Build and push identity-service
        working-directory: ./identity-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smarthealth-identity-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/smarthealth-identity-service:latest

      # Bước 12: Build & Push clinic-web Docker image
      - name: Build and push clinic-web
        working-directory: ./web-app/clinic-website
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smarthealth-clinic-web:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/smarthealth-clinic-web:latest

      # Bước 13: Build & Push api-gateway Docker image
      - name: Build and push api-gateway
        working-directory: ./api-gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smarthealth-api-gateway:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/smarthealth-api-gateway:latest
      # -------------------- Deploy to Server --------------------
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.166.183.74
          username: root
          port: 24700
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/clinic-management
            docker-compose pull identity-service clinic-web api-gateway
            docker-compose up -d --no-deps --force-recreate identity-service clinic-web api-gateway
