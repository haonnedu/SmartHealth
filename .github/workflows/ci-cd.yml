name: CI/CD Pipeline for SmartHealth

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # BACKEND (identity-service)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build identity-service
        working-directory: ./identity-service
        run: mvn clean package -DskipTests

      # FRONTEND (clinic-web)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node.js modules for clinic-web
        uses: actions/cache@v4
        with:
          path: ./web-app/clinic-website/node_modules
          key: ${{ runner.os }}-node-clinic-web-${{ hashFiles('./web-app/clinic-website/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-clinic-web-

      - name: Build clinic-web
        working-directory: ./web-app/clinic-website
        run: |
          echo "NEXT_PUBLIC_API_URL=https://api.smarthealth.io.vn" > .env.production
          npm ci
          npm run build

      # API Gateway
      - name: Cache Node.js modules for api-gateway
        uses: actions/cache@v4
        with:
          path: ./api-gateway/node_modules
          key: ${{ runner.os }}-node-api-gateway-${{ hashFiles('./api-gateway/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-api-gateway-

      - name: Build api-gateway
        working-directory: ./api-gateway
        run: |
          npm ci
          npm run build --if-present

      # BACKEND (web-app-service - NestJS)
      - name: Cache Node.js modules for web-app-service
        uses: actions/cache@v4
        with:
          path: ./web-app-service/node_modules
          key: ${{ runner.os }}-node-web-app-service-${{ hashFiles('./web-app-service/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-web-app-service-

      - name: Set up Node.js for web-app-service
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build web-app-service
        working-directory: ./web-app-service
        run: |
          yarn install --frozen-lockfile
          yarn build

      # Docker Hub login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push images
      - name: Build and push identity-service
        working-directory: ./identity-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smarthealth-identity-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/smarthealth-identity-service:latest
          docker image prune -f

      - name: Build and push clinic-web
        working-directory: ./web-app/clinic-website
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smarthealth-clinic-web:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/smarthealth-clinic-web:latest
          docker image prune -f

      - name: Build and push api-gateway
        working-directory: ./api-gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smarthealth-api-gateway:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/smarthealth-api-gateway:latest
          docker image prune -f

      - name: Build and push web-app-service
        working-directory: ./web-app-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smarthealth-web-app-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/smarthealth-web-app-service:latest
          docker image prune -f

      # Deploy to Server
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.166.183.74
          username: root
          port: 24700
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/clinic-management
            docker-compose pull identity-service clinic-web api-gateway web-app-service
            docker image prune -f
            docker-compose up -d --no-deps --force-recreate identity-service clinic-web api-gateway web-app-service
