name: CI/CD Pipeline

on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Bước 3: Build identity-service
      - name: Build identity-service with Maven
        working-directory: ./identity-service
        run: mvn clean package -DskipTests

      # Bước 4: Cài đặt Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Bước 5: Build clinic-web
      - name: Build clinic-web
        working-directory: ./web-app/clinic-website
        run: |
          npm install
          npm run build

      # Bước 6: Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 7: Build và push Docker image cho identity-service
      - name: Build and push identity-service
        working-directory: ./identity-service
        run: |
          docker build -t yourdockerusername/identity-service:latest .
          docker push yourdockerusername/identity-service:latest

      # Bước 8: Build và push Docker image cho clinic-web
      - name: Build and push clinic-web
        working-directory: ./web-app/clinic-website
        run: |
          docker build -t yourdockerusername/clinic-web:latest .
          docker push yourdockerusername/clinic-web:latest

      # Bước 9: Triển khai lên server
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.166.183.74
          username: root
          port: 24700
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/clinic-management
            git pull origin main
            docker-compose pull
            docker-compose up -d --build
